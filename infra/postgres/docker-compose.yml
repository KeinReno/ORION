# Local Postgres for ORION development.
#   docker compose -f infra/postgres/docker-compose.yml up -d
services:
  postgres:
    image: postgres:16
    container_name: orion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion_local_dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - orion_pgdata:/var/lib/postgresql/data
      # Only runs automatically against a brand-new (empty) volume.
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orion_pgdata:
