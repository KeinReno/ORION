<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KAIDEN ORION — splash prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #151515;
    --cream: #fef1e8;
    --taupe: #988575;
    --amber: #d69900;
    --ease-brand: cubic-bezier(0.625, 0.05, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(120% 90% at 50% 42%, #1b1a19 0%, var(--bg) 55%, #0e0e0e 100%);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    color: var(--cream);
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }
  ::selection { background: var(--amber); color: #151515; }

  #stage { position: fixed; inset: 0; display: block; }

  /* ---------- wordmark ---------- */
  .wordmark {
    position: fixed;
    left: 50%; top: 64%;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
  }
  .brand {
    font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;
    font-weight: 500;
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: 0.5em;
    text-indent: 0.5em; /* компенсация трекинга */
    color: var(--taupe);
    opacity: 0;
    transition:
      opacity 0.7s var(--ease-brand),
      letter-spacing 0.9s var(--ease-brand),
      color 0.9s var(--ease-brand);
  }
  .brand.in { opacity: 1; letter-spacing: 0.22em; text-indent: 0.22em; color: var(--amber); }
  .product {
    margin-top: 0.35em;
    font-weight: 700;
    font-size: clamp(64px, 11vw, 160px);
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .product .ch {
    display: inline-block;
    overflow: hidden;
    vertical-align: bottom;
  }
  .product .ch > span {
    display: inline-block;
    transform: translateY(115%);
    will-change: transform;
    transition: transform 0.85s var(--ease-brand);
  }
  .product.in .ch > span { transform: translateY(0); }

  /* ---------- status line ---------- */
  .status {
    position: fixed;
    left: 50%; bottom: 8vh;
    transform: translateX(-50%);
    width: min(420px, 70vw);
    font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    color: var(--taupe);
    opacity: 0;
    transition: opacity 0.6s var(--ease-brand);
    pointer-events: none;
  }
  .status.in { opacity: 1; }
  .status .row {
    display: flex;
    justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }
  .status .pct { color: var(--cream); }
  .status .bar {
    margin-top: 10px;
    height: 1px;
    background: rgba(152, 133, 117, 0.25);
  }
  .status .bar-fill {
    height: 100%;
    width: 0%;
    background: var(--amber);
    will-change: width;
  }

  .tag {
    position: fixed;
    left: 24px; bottom: 20px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    color: rgba(152, 133, 117, 0.55);
    opacity: 0;
    transition: opacity 0.8s ease 0.2s;
    pointer-events: none;
  }
  .tag.in { opacity: 1; }

  .hint {
    position: fixed;
    right: 24px; bottom: 20px;
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 10px;
    letter-spacing: 0.14em;
    color: rgba(152, 133, 117, 0.4);
    pointer-events: none;
  }

  /* финальный переход в приложение */
  #veil {
    position: fixed; inset: 0;
    background: #101010;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
  }
  body.done #veil { opacity: 1; pointer-events: all; }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0.01s !important; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="wordmark">
  <div class="brand" id="brand">KAIDEN</div>
  <h1 class="product" id="product" aria-label="ORION">ORION</h1>
</div>

<div class="status" id="status">
  <div class="row">
    <span id="statusText">INITIALIZING CORE</span>
    <span class="pct" id="statusPct">0%</span>
  </div>
  <div class="bar"><div class="bar-fill" id="barFill"></div></div>
</div>

<div class="tag" id="tag">KAIDEN ORION PLATFORM 1.0</div>
<div class="hint">ПРОТОТИП — КЛИК / ЛЮБАЯ КЛАВИША = ПРОПУСК</div>
<div id="veil"></div>

<script>
(() => {
  // ------------------------------------------------------------------
  // Случайность с seed от времени запуска: порядок мерцания звёзд
  // каждый раз немного другой — заставка не «застаивается».
  // ------------------------------------------------------------------
  const seed = (Date.now() % 2147483646) + 1;
  let _s = seed;
  const rnd = () => (_s = (_s * 16807) % 2147483647) / 2147483647;

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  // ------------------------------------------------------------------
  // Созвездие Ориона (нормированные координаты 0..1 в «рамке» сцены)
  // Бетельгейзе — красный сверхгигант, поэтому тонирована янтарем;
  // Ригель — голубовато-белый. Это реальная астрономия, не декор.
  // ------------------------------------------------------------------
  // Вид как на реальном небе: Бетельгейзе слева вверху (красноватая),
  // Ригель справа внизу (голубовато-белый), пояс наклонён вверх вправо.
  const STARS = [
    { n: 'Betelgeuse', x: 0.360, y: 0.190, r: 3.4, tint: '#e8a33d', delay: 220 },
    { n: 'Bellatrix',  x: 0.655, y: 0.200, r: 2.6, tint: '#fef1e8', delay: 340 },
    { n: 'Alnitak',    x: 0.440, y: 0.372, r: 2.4, tint: '#fef1e8', delay: 470 },
    { n: 'Alnilam',    x: 0.505, y: 0.356, r: 2.7, tint: '#fef1e8', delay: 600 },
    { n: 'Mintaka',    x: 0.570, y: 0.340, r: 2.4, tint: '#fef1e8', delay: 730 },
    { n: 'Saiph',      x: 0.415, y: 0.530, r: 2.6, tint: '#fef1e8', delay: 860 },
    { n: 'Rigel',      x: 0.620, y: 0.520, r: 3.4, tint: '#e9eeff', delay: 1000 },
  ];
  const LINKS = [
    [0, 1],           // плечи
    [0, 2], [1, 4],   // плечи -> пояс
    [2, 3], [3, 4],   // пояс
    [2, 5], [4, 6],   // пояс -> ноги
    [5, 6],           // ноги
  ];
  // Меч Ориона — три тусклые точки под поясом (деталь для внимательных)
  const SWORD = [
    { x: 0.500, y: 0.420, r: 1.2 },
    { x: 0.498, y: 0.450, r: 1.6 },
    { x: 0.496, y: 0.480, r: 1.2 },
  ];

  // Рамка созвездия: верхняя треть, над вордмарком
  function frame() {
    const size = Math.min(W * 0.5, H * 0.5, 560);
    const cx = W / 2, cy = H * 0.33;
    return {
      px: nx => cx + (nx - 0.5) * size,
      py: ny => cy + (ny - 0.3) * size,
      scale: Math.min(1.4, Math.max(0.85, size / 500)),
    };
  }

  // Фоновое звёздное поле
  const FIELD = Array.from({ length: 130 }, () => ({
    x: rnd(), y: rnd(),
    r: 0.4 + rnd() * 1.1,
    base: 0.06 + rnd() * 0.22,
    tw: 0.4 + rnd() * 1.6,
    ph: rnd() * Math.PI * 2,
  }));
  STARS.forEach(s => { s.ph = rnd() * Math.PI * 2; s.tw = 0.9 + rnd() * 0.9; });
  SWORD.forEach(s => { s.ph = rnd() * Math.PI * 2; });

  // ------------------------------------------------------------------
  // Хореография (мс)
  // ------------------------------------------------------------------
  const T = {
    fieldIn: 400,          // поле проступает из темноты
    lineStart: 950,        // линии начинают тянуться
    lineDur: 260,          // длительность одной линии
    lineStagger: 95,
    brandIn: 1750,         // KAIDEN
    productIn: 1900,       // ORION посимвольно
    charStagger: 50,
    statusIn: 2250,
    progressFrom: 2350,
    progressTo: 3050,
    pulse: 2000,           // импульс «система собрана»
  };
  const LAST_LINE_END = T.lineStart + T.lineStagger * (LINKS.length - 1) + T.lineDur;
  const END = Math.max(T.progressTo, LAST_LINE_END) + 500;

  const easeOutBack = p => { const c = 1.70158; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const clamp01 = v => Math.max(0, Math.min(1, v));
  const easeIO = p => p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

  // ------------------------------------------------------------------
  // DOM-таймлайн
  // ------------------------------------------------------------------
  const product = document.getElementById('product');
  const text = product.textContent;
  product.textContent = '';
  [...text].forEach((c, i) => {
    const wrap = document.createElement('span');
    wrap.className = 'ch';
    const inner = document.createElement('span');
    inner.textContent = c;
    inner.style.transitionDelay = (i * T.charStagger) + 'ms';
    wrap.appendChild(inner);
    product.appendChild(wrap);
  });

  const brand = document.getElementById('brand');
  const status = document.getElementById('status');
  const statusText = document.getElementById('statusText');
  const statusPct = document.getElementById('statusPct');
  const barFill = document.getElementById('barFill');
  const tag = document.getElementById('tag');

  const PHASES = ['INITIALIZING CORE', 'CONTRACTS', 'MODULES', 'PLUGINS', 'READY'];

  // ------------------------------------------------------------------
  // Рендер
  // ------------------------------------------------------------------
  let start = null;
  let skipped = false;

  // Отладочный параметр ?shot=<мс>: детерминированный кадр для скриншотов
  const shotParam = new URLSearchParams(location.search).get('shot');
  if (shotParam !== null) {
    const st = document.createElement('style');
    st.textContent = '*{transition:none!important}';
    document.head.appendChild(st);
  }

  const captureParam = new URLSearchParams(location.search).get('capture');

  // Кривая бренда для canvas-оверлея (та же, что у CSS-переходов)
  function cubicBezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    return x => {
      let t = x;
      for (let i = 0; i < 6; i++) {
        const xv = ((ax * t + bx) * t + cx) * t - x;
        if (Math.abs(xv) < 1e-4) break;
        const dx = (3 * ax * t + 2 * bx) * t + cx;
        if (Math.abs(dx) < 1e-6) break;
        t -= xv / dx;
      }
      return ((ay * t + by) * t + cy) * t;
    };
  }
  const easeBrand = cubicBezier(0.625, 0.05, 0, 1);
  const mixColor = (a, b, m) => 'rgb(' + a.map((v, i) => Math.round(v + (b[i] - v) * m)).join(',') + ')';

  function renderFrame(t) {
    // фон рисуем в canvas (а не только в CSS), чтобы он попадал в видеозахват
    const bg = ctx.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, Math.max(W, H) * 0.95);
    bg.addColorStop(0, '#1b1a19');
    bg.addColorStop(0.55, '#151515');
    bg.addColorStop(1, '#0e0e0e');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    const f = frame();
    const clock = t / 1000; // детерминированные часы мерцания

    // фоновое поле
    const fieldA = clamp01(t / T.fieldIn);
    for (const s of FIELD) {
      const tw = 1 + 0.35 * Math.sin(clock * s.tw + s.ph);
      ctx.globalAlpha = s.base * tw * fieldA;
      ctx.fillStyle = '#fef1e8';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // меч (появляется вместе с полем, очень тускло)
    for (const s of SWORD) {
      const a = 0.18 + 0.08 * Math.sin(clock * 0.8 + s.ph);
      ctx.globalAlpha = a * fieldA;
      ctx.fillStyle = '#fef1e8';
      ctx.beginPath();
      ctx.arc(f.px(s.x), f.py(s.y), s.r * f.scale, 0, Math.PI * 2);
      ctx.fill();
    }

    // линии созвездия: трейсинг с янтарной «головой»
    LINKS.forEach((ln, i) => {
      const lt = clamp01((t - (T.lineStart + i * T.lineStagger)) / T.lineDur);
      if (lt <= 0) return;
      const e = easeIO(lt);
      const a = STARS[ln[0]], b = STARS[ln[1]];
      const x0 = f.px(a.x), y0 = f.py(a.y), x1 = f.px(b.x), y1 = f.py(b.y);
      const hx = x0 + (x1 - x0) * e, hy = y0 + (y1 - y0) * e;

      ctx.globalAlpha = 0.55;
      ctx.strokeStyle = '#fef1e8';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x0, y0);
      ctx.lineTo(hx, hy);
      ctx.stroke();

      if (lt < 1) { // светящаяся головка на конце растущей линии
        const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 9 * f.scale);
        g.addColorStop(0, 'rgba(214,153,0,0.9)');
        g.addColorStop(1, 'rgba(214,153,0,0)');
        ctx.globalAlpha = 1;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(hx, hy, 9 * f.scale, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // импульс «система собрана»
    const pt = clamp01((t - T.pulse) / 900);
    if (pt > 0 && pt < 1) {
      const pr = (0.1 + pt * 0.45) * Math.min(W, H);
      ctx.globalAlpha = 0.10 * (1 - pt);
      ctx.strokeStyle = '#d69900';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(f.px(0.5), f.py(0.36), pr, 0, Math.PI * 2);
      ctx.stroke();
    }

    // главные звёзды: появляются последовательно, со вспышкой-«плюсом»
    for (const s of STARS) {
      const st = clamp01((t - s.delay) / 420);
      if (st <= 0) continue;
      const pop = easeOutBack(st);
      const tw = 1 + 0.16 * Math.sin(clock * s.tw + s.ph);
      const x = f.px(s.x), y = f.py(s.y);
      const r = s.r * f.scale * pop;

      ctx.globalAlpha = tw;
      ctx.fillStyle = s.tint;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();

      // крест-блик при появлении
      const glint = st < 1 ? (1 - st) : 0;
      if (glint > 0) {
        const g = 16 * f.scale * (0.4 + st);
        ctx.globalAlpha = glint * 0.9;
        ctx.strokeStyle = s.tint;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x - g, y); ctx.lineTo(x + g, y);
        ctx.moveTo(x, y - g); ctx.lineTo(x, y + g);
        ctx.stroke();
      }

      // лёгкое свечение крупных звёзд
      if (s.r > 3) {
        const g = ctx.createRadialGradient(x, y, 0, x, y, r * 6);
        g.addColorStop(0, s.tint === '#e8a33d' ? 'rgba(214,153,0,0.20)' : 'rgba(254,241,232,0.14)');
        g.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.globalAlpha = tw;
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(x, y, r * 6, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------
  // Текстовый оверлей для видеозахвата: повторяет DOM-версию,
  // но рисуется в тот же canvas, чтобы попасть в кадр.
  // ------------------------------------------------------------------
  function renderOverlayText(t) {
    const cx = W / 2;
    const cyW = H * 0.64;

    // KAIDEN
    const bA = clamp01((t - T.brandIn) / 700);
    const bMix = easeBrand(clamp01((t - T.brandIn) / 900));
    if (bA > 0) {
      const bPx = Math.max(11, Math.min(W * 0.014, 15));
      const lsEm = 0.5 + (0.22 - 0.5) * bMix;
      ctx.save();
      ctx.globalAlpha = bA;
      ctx.font = `500 ${bPx}px 'IBM Plex Mono', monospace`;
      ctx.letterSpacing = (lsEm * bPx) + 'px';
      ctx.fillStyle = mixColor([152, 133, 117], [214, 153, 0], bMix);
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      const pPxTmp = Math.max(64, Math.min(W * 0.11, 160));
      ctx.fillText('KAIDEN', cx, cyW - pPxTmp * 0.62);
      ctx.restore();
    }

    // ORION посимвольно
    const pPx = Math.max(64, Math.min(W * 0.11, 160));
    ctx.font = `700 ${pPx}px 'Space Grotesk', sans-serif`;
    const tracking = -0.02 * pPx;
    const chars = [...'ORION'];
    const widths = chars.map(c => ctx.measureText(c).width);
    const total = widths.reduce((a, b) => a + b, 0) + tracking * (chars.length - 1);
    const baseline = cyW + pPx * 0.38;
    let x = cx - total / 2;
    chars.forEach((c, i) => {
      const p = clamp01((t - T.productIn - i * T.charStagger) / 850);
      if (p > 0) {
        const e = easeBrand(p);
        const dy = (1 - e) * pPx * 1.15;
        ctx.save();
        ctx.beginPath();
        ctx.rect(x - 2, baseline - pPx * 1.3, widths[i] + 4, pPx * 1.7);
        ctx.clip();
        ctx.fillStyle = '#fef1e8';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'alphabetic';
        ctx.fillText(c, x, baseline + dy);
        ctx.restore();
      }
      x += widths[i] + tracking;
    });

    // статус-строка
    const sA = clamp01((t - T.statusIn) / 600);
    if (sA > 0) {
      const w = Math.min(420, W * 0.7);
      const x0 = cx - w / 2;
      const barY = H - H * 0.08;
      const p = clamp01((t - T.progressFrom) / (T.progressTo - T.progressFrom));
      const pct = Math.round(easeIO(p) * 100);
      const phase = PHASES[Math.min(PHASES.length - 1, Math.floor(p * PHASES.length))];
      ctx.save();
      ctx.globalAlpha = sA;
      ctx.font = `400 11px 'IBM Plex Mono', monospace`;
      ctx.letterSpacing = (0.14 * 11) + 'px';
      ctx.textBaseline = 'alphabetic';
      ctx.textAlign = 'left';
      ctx.fillStyle = '#988575';
      ctx.fillText(phase, x0, barY - 10);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fef1e8';
      ctx.fillText(pct + '%', x0 + w, barY - 10);
      ctx.letterSpacing = '0px';
      ctx.fillStyle = 'rgba(152,133,117,0.25)';
      ctx.fillRect(x0, barY, w, 1);
      ctx.fillStyle = '#d69900';
      ctx.fillRect(x0, barY, w * pct / 100, 1);
      // тег версии
      ctx.globalAlpha = sA;
      ctx.font = `400 10px 'IBM Plex Mono', monospace`;
      ctx.letterSpacing = '1.8px';
      ctx.fillStyle = 'rgba(152,133,117,0.55)';
      ctx.textAlign = 'left';
      ctx.fillText('KAIDEN ORION PLATFORM 1.0', 24, H - 20);
      ctx.restore();
    }

    // финальная вуаль — переход в приложение
    const vA = clamp01((t - (END + 400)) / 450);
    if (vA > 0) {
      ctx.globalAlpha = vA;
      ctx.fillStyle = '#101010';
      ctx.fillRect(0, 0, W, H);
      ctx.globalAlpha = 1;
    }
  }

  function draw(now) {
    if (start === null) start = now;
    const t = skipped ? END : (shotParam !== null ? +shotParam : (now - start));

    renderFrame(t);

    // DOM-события
    if (t >= T.brandIn) brand.classList.add('in');
    if (t >= T.productIn) product.classList.add('in');
    if (t >= T.statusIn) { status.classList.add('in'); tag.classList.add('in'); }

    const p = clamp01((t - T.progressFrom) / (T.progressTo - T.progressFrom));
    const pct = Math.round(easeIO(p) * 100);
    statusPct.textContent = pct + '%';
    barFill.style.width = pct + '%';
    statusText.textContent = PHASES[Math.min(PHASES.length - 1, Math.floor(p * PHASES.length))];

    if (!skipped) {
      // холд-кадр: продолжаем мерцание, пока хост не заберёт управление
      requestAnimationFrame(draw);
    }
  }

  function finish() {
    document.body.classList.add('done');
    // Точка интеграции: хост-приложение подписывается на это событие
    // и монтирует главный экран поверх/вместо splash.
    dispatchEvent(new CustomEvent('kaiden:splash-finished'));
  }

  function skip() {
    if (skipped) return;
    skipped = true;
    brand.classList.add('in');
    product.classList.add('in');
    status.classList.add('in');
    tag.classList.add('in');
    statusPct.textContent = '100%';
    barFill.style.width = '100%';
    statusText.textContent = 'READY';
    setTimeout(finish, 600);
  }

  addEventListener('pointerdown', skip);
  addEventListener('keydown', skip);

  // API для хоста: когда приложение реально загрузилось —
  // window.KAIDEN_SPLASH.ready() вместо таймера.
  window.KAIDEN_SPLASH = { ready: skip };

  if (captureParam !== null) {
    // Режим видеозахвата: прогоняем таймлайн покадрово и отдаём PNG на сервер
    const st = document.createElement('style');
    st.textContent = '.wordmark,.status,.tag,.hint{display:none!important}';
    document.head.appendChild(st);
    (async () => {
      resize();
      await Promise.all([
        document.fonts.load(`700 100px 'Space Grotesk'`),
        document.fonts.load(`500 15px 'IBM Plex Mono'`),
        document.fonts.load(`400 11px 'IBM Plex Mono'`),
      ]);
      const FPS = 30, DUR = 4500;
      const N = Math.round(DUR / 1000 * FPS);
      for (let i = 0; i <= N; i++) {
        const t = i * 1000 / FPS;
        renderFrame(t);
        renderOverlayText(t);
        await fetch('/frame?i=' + i, { method: 'POST', body: canvas.toDataURL('image/png') });
      }
      await fetch('/done', { method: 'POST' });
    })();
  }
  else if (reduceMotion) { skip(); }
  else requestAnimationFrame(draw);
})();
</script>
</body>
</html>
