name: Android alpha
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/android/**"
      - "packages/mobile-core/**"
      - "packages/shared-types/**"
      - "packages/core/**"
      - "pnpm-lock.yaml"
      - "scripts/android-*.mjs"
      - ".github/workflows/android.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run packages/mobile-core/src
      - run: pnpm --filter @orion/android build
      - run: pnpm --filter @orion/android android:sync
      - run: bash gradlew assembleDebug assembleRelease lintDebug testDebugUnitTest --console=plain
        working-directory: apps/android/android
      - uses: actions/upload-artifact@v4
        with:
          name: kaiden-orion-android-alpha
          path: |
            apps/android/android/app/build/outputs/apk/debug/*.apk
            apps/android/android/app/build/outputs/apk/release/*.apk
