[package]
name = "orion-runtime"
version = "0.1.0"
edition = "2021"
description = "ORION Rust experimental runtime: isolated ports, data directory, and startup diagnostics"
publish = false

[lib]
name = "orion_runtime"
path = "src/lib.rs"

[[bin]]
name = "orion-runtime"
path = "src/main.rs"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
