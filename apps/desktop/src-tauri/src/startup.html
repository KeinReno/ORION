<!doctype html>
<html lang="ru" data-edition="{{STARTUP_EDITION}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запуск ORION</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;background:#16171a;color:#edece8;--canvas:#16171A;--gold:#C9A86A;--gold-bright:#E7D7A8;--text:#EDECE8;--ink:#BEB9AF;--muted:#6E6A60;--danger:#EFB3A8;--danger-deep:#5A3630;--card:#1F1D1A;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--canvas)}
/* Свет и орбиты за печатью (KUI: ld.glow / ld.orbit.a|b). */
.field{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.field::before{content:"";position:absolute;left:50%;top:38%;width:500px;height:500px;margin:-250px 0 0 -250px;background:radial-gradient(circle,rgba(201,168,106,.2),transparent 66%)}
.orbit{position:absolute;left:50%;top:38%;border-radius:50%;transform:translate(-50%,-50%)}
.orbit-a{width:min(700px,150vmin);height:min(700px,150vmin);border:1px solid rgba(201,168,106,.12)}
.orbit-b{width:min(980px,210vmin);height:min(980px,210vmin);border:1px solid rgba(201,168,106,.07)}
main{position:relative;width:min(28rem,100%);display:flex;flex-direction:column;align-items:center;text-align:center;padding:24px}
.seal{position:relative;width:176px;height:176px;margin:0 0 24px}
.plot{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plot *{fill:none;stroke-linecap:round}
.ring{stroke-dasharray:553;stroke-dashoffset:553}
.ring.outer{stroke:#C9A86A99;stroke-width:1.5}
.ring.inner{stroke:#E7D7A880;stroke-width:1;stroke-dasharray:1.6 4.6;stroke-dashoffset:540}
.arc{stroke:var(--gold-bright);stroke-width:2.5;stroke-dasharray:553;stroke-dashoffset:300}
.tick{fill:var(--gold-bright);stroke:none;opacity:0;transform-box:fill-box;transform-origin:center}
.mark{width:124px;height:124px;object-fit:contain;display:block;position:absolute;left:26px;top:26px;mix-blend-mode:screen;z-index:1}
.pill{display:none;align-self:center;margin:0 0 26px;padding:6px 14px;border:1px solid #C9A86A99;border-radius:999px;font-size:12px;letter-spacing:.08em;color:var(--gold)}
body.premiere .pill{display:inline-block}
h1{font-size:30px;font-weight:500;letter-spacing:.13em;margin:0;color:var(--text)}
.role{color:var(--ink);font-size:14px;margin:10px 0 0}
h2{font-weight:500;font-size:20px;line-height:1.4;margin:26px 0 0;color:var(--text);text-wrap:balance}
.steps{display:flex;justify-content:center;align-items:center;gap:36px;margin:22px 0 0;list-style:none;padding:0}
.steps li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);white-space:nowrap}
.steps li .dot{width:8px;height:8px;border-radius:50%;border:1px solid #4A463C;flex:none}
.steps li.done{color:#9A927E}
.steps li.done .dot{display:none}
.steps li.done .check{display:block;width:12px;height:12px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.steps li.current{color:var(--gold-bright);font-weight:500}
.steps li.current .dot{background:var(--gold);border-color:var(--gold)}
.steps .check{display:none}
p{font-size:14px;line-height:1.65;color:var(--ink);margin:0;max-width:46ch}
#hint{margin-top:16px}
.track{width:280px;height:2px;border-radius:1px;background:#FFFFFF14;margin-top:24px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s var(--ease)}
.time{margin-top:12px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#error{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--danger);margin-top:14px;font-size:13px;line-height:1.55}
button{font:inherit;border:1px solid #4A463C;color:var(--text);background:transparent;border-radius:8px;padding:12px 22px;margin-top:22px;cursor:pointer}
button:hover{border-color:#736342;background:#1F1D1A}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#retry{background:var(--gold);border-color:var(--gold);color:#16171A;font-weight:500}
#retry:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
#skip{background:transparent;border-color:transparent;color:var(--ink);padding:6px 0;margin-top:18px}
#skip:hover{background:transparent;color:var(--text)}
#version{position:fixed;left:40px;bottom:28px;margin:0;font-family:Consolas,"Courier New",monospace;font-size:11px;color:#55524A;max-width:none}
[hidden]{display:none!important}
::selection{background:#c9a86a;color:#16171a}
body.is-motion{--draw:1.15s}
body.is-motion.premiere{--draw:2.5s}
body.is-motion .ring.outer{animation:ink var(--draw) var(--ease) forwards}
body.is-motion .ring.inner{animation:ink var(--draw) var(--ease) forwards;animation-delay:calc(var(--draw)*.22)}
body.is-motion .arc{animation:ink var(--draw) var(--ease) forwards;animation-delay:calc(var(--draw)*.3)}
body.is-motion .t1{animation:tickin .28s var(--ease) both;animation-delay:calc(var(--draw)*.48)}
body.is-motion .t2{animation:tickin .28s var(--ease) both;animation-delay:calc(var(--draw)*.58)}
body.is-motion .t3{animation:tickin .28s var(--ease) both;animation-delay:calc(var(--draw)*.68)}
body.is-motion .t4{animation:tickin .28s var(--ease) both;animation-delay:calc(var(--draw)*.78)}
body.is-motion:not(.is-hold) .mark{opacity:0;animation:lock .5s var(--ease) both;animation-delay:calc(var(--draw)*.74)}
body.is-motion.premiere .pulse{animation:bloom .85s var(--ease) both;animation-delay:calc(var(--draw)*.82)}
body.is-motion.premiere:not(.is-hold) h1{animation:arrive .9s .9s var(--ease) both}
body.is-motion.premiere:not(.is-hold) .role{animation:rise .7s 1.35s var(--ease) both}
body.is-motion.premiere:not(.is-hold) h2,.is-motion.premiere:not(.is-hold) .steps,.is-motion.premiere:not(.is-hold) #hint{animation:rise .7s 1.7s var(--ease) both}
body.is-depart .plot,body.is-failed .plot,body.is-depart .pulse{display:none}
body.is-hold .mark,body.is-depart .mark,body.is-failed .mark{animation:none;opacity:1;filter:none}
body.is-motion .field::before{animation:drift 16s ease-in-out infinite}
body.is-motion .orbit-a{animation:spin 42s linear infinite}
body.is-motion .orbit-b{animation:spin 68s linear infinite reverse}
body.is-motion.is-hold .field::before{animation:breath 3.6s ease-in-out infinite}
body.is-motion #stage.tick{animation:stage .22s var(--ease)}
body.is-failed .field::before{background:radial-gradient(circle,rgba(201,117,106,.14),transparent 66%)}
body.is-failed .ring.outer{stroke:#C9756A99}
body.is-failed .ring.inner{stroke:#EFB3A866}
body.is-failed .tick{fill:#C9756A}
body.is-depart main{animation:leave .42s cubic-bezier(.4,0,1,1) forwards}
body.is-failed h1,body.is-failed .role,body.is-failed #stage,body.is-failed #hint,body.is-failed #error{animation:none;opacity:1;filter:none;transform:none}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes tickin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes lock{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
@keyframes bloom{from{opacity:.8;transform:scale(.72)}to{opacity:0;transform:scale(1.22)}}
@keyframes arrive{from{opacity:0;letter-spacing:.26em;filter:blur(6px)}to{opacity:1;letter-spacing:.13em;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes breath{0%,100%{opacity:.5;transform:scale(.94)}50%{opacity:1;transform:scale(1)}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.7}50%{transform:translate3d(0,-18px,0) scale(1.05);opacity:1}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes stage{from{opacity:.45}to{opacity:1}}
@keyframes leave{to{opacity:0;transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){
  .plot,.pulse,.mark,h1,.role,h2,.steps,#hint,main,.field::before,.orbit{animation:none!important}
  .plot,.pulse{display:none}
  .mark{opacity:1;filter:none}
}
@media(max-width:500px){.steps{gap:18px;flex-wrap:wrap}#version{left:20px;bottom:16px}}
</style></head><body><div class="field" aria-hidden="true"><span class="orbit orbit-a"></span><span class="orbit orbit-b"></span></div><main aria-busy="true" id="main">
<span class="pill" id="pill">Обновление</span>
<div class="seal">
<svg class="plot" viewBox="0 0 176 176" aria-hidden="true">
<circle class="ring outer" cx="88" cy="88" r="88"/>
<circle class="ring inner" cx="88" cy="88" r="79"/>
<path class="arc" d="M88 0 A88 88 0 1 1 36.3 159.2"/>
<circle class="tick t1" cx="88" cy="3" r="3"/>
<circle class="tick t2" cx="173" cy="88" r="3"/>
<circle class="tick t3" cx="88" cy="173" r="3"/>
<circle class="tick t4" cx="3" cy="88" r="3"/>
</svg>
<span class="pulse" aria-hidden="true"></span>
<img class="mark" src="/__orion_startup/logo.png" alt="" width="124" height="124">
</div>
<h1>ORION</h1>
<p class="role">Локальная рабочая среда</p>
<h2 id="stage" role="status" aria-live="polite">Готовим рабочую среду</h2>
<ul class="steps" id="steps" aria-hidden="true">
  <li data-phase="preparing"><svg class="check" viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6"/></svg><span class="dot"></span><span>Подготовка</span></li>
  <li data-phase="database"><svg class="check" viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6"/></svg><span class="dot"></span><span>База данных</span></li>
  <li data-phase="migrations"><svg class="check" viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6"/></svg><span class="dot"></span><span>Структура данных</span></li>
  <li data-phase="server"><svg class="check" viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6"/></svg><span class="dot"></span><span>Сервер</span></li>
  <li data-phase="ready"><svg class="check" viewBox="0 0 12 12"><path d="M2 6.5 5 9l5-6"/></svg><span class="dot"></span><span>Открытие</span></li>
</ul>
<p id="hint">Запускаем локальные службы на этом компьютере.</p>
<div class="track" aria-hidden="true"><i id="fill"></i></div>
<p class="time" id="time">00:00</p>
<p id="error" role="alert" hidden></p>
<button id="retry" type="button" hidden>Проверить ещё раз</button>
<button id="skip" type="button" hidden>Пропустить</button>
</main><p id="version"></p><script>
(() => {
  const started = performance.now();
  let stopped = false, failures = 0, holdTimer = 0, progress = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const edition = document.documentElement.dataset.edition || "";
  const seenKey = "orion.startup.edition";
  let premiere = false;
  try { premiere = edition !== "" && localStorage.getItem(seenKey) !== edition; } catch { premiere = false; }
  const labels = { preparing: "Готовим рабочую среду", database: "Подключаем базу данных", migrations: "Проверяем структуру данных", server: "Запускаем локальный сервер", ready: "Открываем ORION" };
  const order = ["preparing", "database", "migrations", "server", "ready"];
  const main = document.getElementById("main"), stage = document.getElementById("stage"), hint = document.getElementById("hint"), error = document.getElementById("error"), retry = document.getElementById("retry"), skip = document.getElementById("skip"), fill = document.getElementById("fill"), pill = document.getElementById("pill");
  if (edition) document.getElementById("version").textContent = `ORION ${edition}`;
  if (edition && premiere) pill.textContent = `Обновление ${edition}`;
  function setPhase(phase) {
    const at = order.indexOf(phase);
    for (const [index, item] of [...document.querySelectorAll("#steps li")].entries()) {
      item.classList.toggle("done", at > index || phase === "ready");
      item.classList.toggle("current", at === index && phase !== "ready");
    }
  }
  setPhase("preparing");
  if (!reduce) document.body.classList.add("is-motion");
  function acknowledge() { try { if (edition) localStorage.setItem(seenKey, edition); } catch { /* остаётся премьерой в следующий раз */ } premiere = false; }
  function enterHold() {
    clearTimeout(holdTimer);
    document.body.classList.add("is-hold");
    document.body.classList.remove("premiere");
    skip.hidden = true;
    acknowledge();
  }
  function skipPremiere(event) {
    if (!document.body.classList.contains("premiere") || stopped) return;
    if (event) event.preventDefault();
    enterHold();
  }
  if (premiere && !reduce) {
    document.body.classList.add("premiere");
    skip.hidden = false;
    skip.addEventListener("click", skipPremiere);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" || event.key === "Enter" || event.key === " ") skipPremiere(event);
    });
    main.addEventListener("click", (event) => { if (event.target === skip || event.target === retry) return; skipPremiere(event); });
    holdTimer = setTimeout(() => { if (!stopped) enterHold(); }, 3400);
  } else {
    if (premiere) acknowledge();
    holdTimer = setTimeout(() => { if (!stopped) document.body.classList.add("is-hold"); }, 1600);
  }
  const tick = setInterval(() => {
    const seconds = Math.floor((performance.now() - started) / 1000);
    document.getElementById("time").textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    if (seconds >= 20 && !stopped) hint.textContent = "Запуск занимает больше времени. При первом запуске и после обновления подготовка данных может длиться дольше.";
    if (!stopped) { progress = Math.min(92, progress + (seconds < 10 ? 2.4 : 0.35)); fill.style.width = `${progress}%`; }
  }, 1000);
  function fail(message, canCheck = false) {
    stopped = true;
    clearTimeout(holdTimer);
    document.body.classList.add("is-failed");
    document.body.classList.remove("premiere");
    skip.hidden = true;
    main.setAttribute("aria-busy", "false");
    stage.textContent = "Не удалось запустить ORION";
    error.textContent = message;
    error.hidden = false;
    retry.hidden = !canCheck;
    hint.textContent = "Закройте приложение и запустите его снова. Если ошибка повторится, проверьте журнал запуска по указанному пути.";
    document.getElementById("steps").hidden = true;
    document.querySelector(".track").hidden = true;
    clearInterval(tick);
  }
  function depart() {
    if (stopped) return;
    stopped = true;
    clearTimeout(holdTimer);
    clearInterval(tick);
    acknowledge();
    skip.hidden = true;
    main.setAttribute("aria-busy", "false");
    stage.textContent = labels.ready;
    fill.style.width = "100%";
    setPhase("ready");
    if (reduce) { location.replace("/"); return; }
    document.body.classList.add("is-depart");
    setTimeout(() => location.replace("/"), 460);
  }
  async function poll() {
    try {
      const response = await fetch("/__orion_startup/status", { cache: "no-store", signal: AbortSignal.timeout(4000) });
      if (!response.ok) throw Error("status");
      const state = await response.json();
      failures = 0;
      if (state.phase === "error") { fail(state.error || "Закройте приложение и запустите его снова."); return; }
      const label = labels[state.phase] || labels.preparing;
      if (stage.textContent !== label) {
        stage.textContent = label;
        if (!reduce && !document.body.classList.contains("premiere")) { stage.classList.remove("tick"); void stage.offsetWidth; stage.classList.add("tick"); }
      }
      setPhase(state.phase in labels ? state.phase : "preparing");
      if (state.phase === "ready") { depart(); return; }
    } catch {
      if (++failures >= 10) { fail("Не удаётся получить состояние оболочки.", true); return; }
    }
    if (!stopped) setTimeout(poll, 500);
  }
  retry.addEventListener("click", () => location.reload());
  poll();
})();
</script></body></html>
