<!doctype html>
<html lang="ru" data-edition="{{STARTUP_EDITION}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запуск ORION</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",sans-serif;background:#16171a;color:#edece8;--gold:#c9a86a;--ink:#beb9af;--ease:cubic-bezier(0.16,1,0.3,1)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:40px;overflow:visible;background:radial-gradient(ellipse at 50% 42%,rgba(201,168,106,.14),transparent 46%),radial-gradient(ellipse at 50% 100%,#07080a,transparent 54%),#16171a}
.field{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.field::before{content:"";position:absolute;left:50%;top:40%;width:78vmax;height:78vmax;margin:-39vmax 0 0 -39vmax;background:radial-gradient(circle,rgba(201,168,106,.2),transparent 60%);transform-origin:center}
.orbit{position:absolute;left:50%;top:40%;border-radius:50%;border:1px solid transparent;transform:translate(-50%,-50%)}
.orbit-a{width:92vmin;height:92vmin;border-top-color:rgba(201,168,106,.28);border-right-color:rgba(201,168,106,.08)}
.orbit-b{width:128vmin;height:128vmin;border-bottom-color:rgba(201,168,106,.16);border-left-color:rgba(201,168,106,.05)}
main{position:relative;width:min(28rem,100%);overflow:visible;display:flex;flex-direction:column;align-items:center;text-align:center}
.seal{position:relative;width:168px;height:168px;margin:0 0 28px;overflow:visible}
.seal::before{content:"";position:absolute;left:50%;top:46%;width:360px;height:360px;margin:-180px 0 0 -180px;background:radial-gradient(circle,rgba(201,168,106,.42) 0%,rgba(201,168,106,.16) 34%,transparent 62%);pointer-events:none;transform-origin:center}
.plot{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.plot *{fill:none;stroke:#e7d7a8;stroke-linecap:round}
.ring{stroke-dasharray:415;stroke-dashoffset:415}
.ring.inner{stroke-width:1.25;stroke-dasharray:1.6 4.2;stroke-dashoffset:400}
.ring.outer{stroke-width:1.7}
.hand{stroke:#fff4d4;stroke-width:2.6;stroke-dasharray:26 400;stroke-dashoffset:0}
.rail{stroke-width:1.6;stroke-dasharray:176;stroke-dashoffset:176}
.tick{fill:#e7d7a8;stroke:none;opacity:0;transform-box:fill-box;transform-origin:center}
.mark{width:168px;height:168px;object-fit:contain;display:block;mix-blend-mode:screen;position:relative;z-index:1}
h1{font-size:36px;font-weight:500;letter-spacing:.12em;margin:0}
.role{color:var(--ink);font-size:13px;margin:8px 0 0}
h2{font-weight:500;font-size:21px;line-height:1.4;margin:32px 0 10px;text-wrap:balance}
p{font-size:14px;line-height:1.65;color:var(--ink);margin:0;max-width:42ch}
.time{margin-top:24px;color:var(--gold);font-variant-numeric:tabular-nums}
#error{white-space:pre-wrap;overflow-wrap:anywhere;color:#efb3a8;margin-top:18px}
button{font:inherit;border:1px solid #736342;color:#edece8;background:#28251e;border-radius:8px;padding:10px 16px;margin-top:20px;cursor:pointer}
button:hover{background:#393124}button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#skip{background:transparent;border-color:transparent;color:var(--ink);padding-left:0;padding-right:0}
#skip:hover{background:transparent;color:#edece8}
[hidden]{display:none!important}
::selection{background:#c9a86a;color:#16171a}
body.is-motion{--draw:1.15s}
body.is-motion.premiere{--draw:2.5s}
body.is-motion .ring.outer{animation:ink var(--draw) var(--ease) forwards}
body.is-motion .ring.inner{animation:ink var(--draw) var(--ease) forwards;animation-delay:calc(var(--draw) * .22)}
body.is-motion .rail{animation:ink calc(var(--draw) * .62) var(--ease) forwards;animation-delay:calc(var(--draw) * .34)}
body.is-motion .hand{animation:sweep var(--draw) linear both}
body.is-motion .t1{animation:tickin .28s var(--ease) both;animation-delay:calc(var(--draw) * .48)}
body.is-motion .t2{animation:tickin .28s var(--ease) both;animation-delay:calc(var(--draw) * .58)}
body.is-motion .t3{animation:tickin .28s var(--ease) both;animation-delay:calc(var(--draw) * .68)}
body.is-motion .t4{animation:tickin .28s var(--ease) both;animation-delay:calc(var(--draw) * .78)}
body.is-motion:not(.is-hold) .mark{opacity:0;animation:lock .5s var(--ease) both;animation-delay:calc(var(--draw) * .74)}
body.is-motion.premiere .pulse{animation:bloom .85s var(--ease) both;animation-delay:calc(var(--draw) * .82)}
body.is-motion.premiere:not(.is-hold) h1{animation:arrive .9s .9s var(--ease) both}
body.is-motion.premiere:not(.is-hold) .role{animation:rise .7s 1.35s var(--ease) both}
body.is-motion.premiere:not(.is-hold) #stage,body.is-motion.premiere:not(.is-hold) #hint{animation:rise .7s 1.7s var(--ease) both}
body.is-hold .plot,body.is-depart .plot,body.is-failed .plot,body.is-hold .pulse,body.is-depart .pulse{display:none}
body.is-hold .mark,body.is-depart .mark,body.is-failed .mark{animation:none;opacity:1;filter:none}
body.is-motion .field::before{animation:drift 16s ease-in-out infinite}
body.is-motion .orbit-a{animation:spin 42s linear infinite}
body.is-motion .orbit-b{animation:spin 68s linear infinite reverse}
body.is-motion.is-hold .seal::before{animation:breath 3.6s ease-in-out infinite}
body.is-motion #stage.tick{animation:stage .22s var(--ease)}
body.is-depart main{animation:leave .42s cubic-bezier(.4,0,1,1) forwards}
body.is-failed .seal::before,body.is-depart .seal::before{animation:none}
body.is-failed h1,body.is-failed .role,body.is-failed #stage,body.is-failed #hint,body.is-failed #error{animation:none;opacity:1;filter:none;transform:none}
.pulse{position:absolute;inset:10px;border:1px solid var(--gold);border-radius:50%;opacity:0;pointer-events:none}
@keyframes ink{to{stroke-dashoffset:0}}
@keyframes sweep{to{stroke-dashoffset:-415}}
@keyframes tickin{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
@keyframes lock{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
@keyframes bloom{from{opacity:.8;transform:scale(.72)}to{opacity:0;transform:scale(1.22)}}
@keyframes arrive{from{opacity:0;letter-spacing:.26em;filter:blur(6px)}to{opacity:1;letter-spacing:.12em;filter:blur(0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes breath{0%,100%{opacity:.34;transform:scale(.9)}50%{opacity:.85;transform:scale(1)}}
@keyframes drift{0%,100%{transform:translate3d(0,0,0) scale(1);opacity:.65}50%{transform:translate3d(0,-2.5vmax,0) scale(1.06);opacity:1}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes stage{from{opacity:.45}to{opacity:1}}
@keyframes leave{to{opacity:0;transform:translateY(-8px)}}
@media(prefers-reduced-motion:reduce){
  .plot,.pulse,.mark,h1,.role,#stage,#hint,main,.seal::before,.field::before,.orbit{animation:none!important}
  .plot,.pulse{display:none}
  .mark{opacity:1;filter:none}
}
@media(max-width:500px){body{padding:28px}.seal{margin-bottom:28px}h1{font-size:30px}h2{margin-top:32px}}
</style></head><body><div class="field" aria-hidden="true"><span class="orbit orbit-a"></span><span class="orbit orbit-b"></span></div><main aria-busy="true" id="main">
<div class="seal">
<svg class="plot" viewBox="0 0 192 192" aria-hidden="true">
<circle class="ring outer" cx="96" cy="96" r="66"/>
<circle class="ring inner" cx="96" cy="96" r="60"/>
<line class="rail" x1="93" y1="8" x2="93" y2="184"/>
<line class="rail" x1="99" y1="8" x2="99" y2="184"/>
<circle class="tick t1" cx="96" cy="30" r="2.4"/>
<circle class="tick t2" cx="162" cy="96" r="2.4"/>
<circle class="tick t3" cx="96" cy="162" r="2.4"/>
<circle class="tick t4" cx="30" cy="96" r="2.4"/>
<circle class="hand" cx="96" cy="96" r="66"/>
</svg>
<span class="pulse" aria-hidden="true"></span>
<img class="mark" src="/__orion_startup/logo.png" alt="" width="168" height="168">
</div>
<h1>ORION</h1>
<p class="role">Локальная рабочая среда</p>
<h2 id="stage" role="status" aria-live="polite">Готовим рабочую среду</h2>
<p id="hint">Запускаем локальные службы на этом компьютере.</p>
<p class="time" id="time"></p>
<p id="error" role="alert" hidden></p>
<button id="retry" type="button" hidden>Проверить состояние ещё раз</button>
<button id="skip" type="button" hidden>Пропустить</button>
</main><script>
(() => {
  const started = performance.now();
  let stopped = false, failures = 0, holdTimer = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const edition = document.documentElement.dataset.edition || "";
  const seenKey = "orion.startup.edition";
  let premiere = false;
  try { premiere = edition !== "" && localStorage.getItem(seenKey) !== edition; } catch { premiere = false; }
  const labels = { preparing: "Готовим рабочую среду", database: "Подключаем базу данных", migrations: "Проверяем структуру данных", server: "Запускаем локальный сервер", ready: "Открываем ORION" };
  const main = document.getElementById("main"), stage = document.getElementById("stage"), hint = document.getElementById("hint"), error = document.getElementById("error"), retry = document.getElementById("retry"), skip = document.getElementById("skip");
  if (!reduce) document.body.classList.add("is-motion");
  function acknowledge() { try { if (edition) localStorage.setItem(seenKey, edition); } catch { /* остаётся премьерой в следующий раз */ } premiere = false; }
  function enterHold() {
    clearTimeout(holdTimer);
    document.body.classList.add("is-hold");
    document.body.classList.remove("premiere");
    skip.hidden = true;
    acknowledge();
  }
  function skipPremiere(event) {
    if (!document.body.classList.contains("premiere") || stopped) return;
    if (event) event.preventDefault();
    enterHold();
  }
  if (premiere && !reduce) {
    document.body.classList.add("premiere");
    skip.hidden = false;
    skip.addEventListener("click", skipPremiere);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" || event.key === "Enter" || event.key === " ") skipPremiere(event);
    });
    main.addEventListener("click", (event) => { if (event.target === skip || event.target === retry) return; skipPremiere(event); });
    holdTimer = setTimeout(() => { if (!stopped) enterHold(); }, 3400);
  } else {
    if (premiere) acknowledge();
    holdTimer = setTimeout(() => { if (!stopped) document.body.classList.add("is-hold"); }, 1600);
  }
  const tick = setInterval(() => {
    const seconds = Math.floor((performance.now() - started) / 1000);
    document.getElementById("time").textContent = `${seconds} с`;
    if (seconds >= 20 && !stopped) hint.textContent = "Запуск занимает больше времени. При первом запуске и после обновления подготовка данных может длиться дольше.";
  }, 1000);
  function fail(message, canCheck = false) {
    stopped = true;
    clearTimeout(holdTimer);
    document.body.classList.add("is-failed");
    document.body.classList.remove("premiere");
    skip.hidden = true;
    main.setAttribute("aria-busy", "false");
    stage.textContent = "Не удалось запустить ORION";
    error.textContent = message;
    error.hidden = false;
    retry.hidden = !canCheck;
    hint.textContent = "Закройте приложение и запустите его снова. Если ошибка повторится, проверьте журнал запуска по указанному пути.";
    clearInterval(tick);
  }
  function depart() {
    if (stopped) return;
    stopped = true;
    clearTimeout(holdTimer);
    clearInterval(tick);
    acknowledge();
    skip.hidden = true;
    main.setAttribute("aria-busy", "false");
    stage.textContent = labels.ready;
    if (reduce) { location.replace("/"); return; }
    document.body.classList.add("is-depart");
    setTimeout(() => location.replace("/"), 460);
  }
  async function poll() {
    try {
      const response = await fetch("/__orion_startup/status", { cache: "no-store", signal: AbortSignal.timeout(4000) });
      if (!response.ok) throw Error("status");
      const state = await response.json();
      failures = 0;
      if (state.phase === "error") { fail(state.error || "Закройте приложение и запустите его снова."); return; }
      const label = labels[state.phase] || labels.preparing;
      if (stage.textContent !== label) {
        stage.textContent = label;
        if (!reduce && !document.body.classList.contains("premiere")) { stage.classList.remove("tick"); void stage.offsetWidth; stage.classList.add("tick"); }
      }
      if (state.phase === "ready") { depart(); return; }
    } catch {
      if (++failures >= 10) { fail("Не удаётся получить состояние оболочки.", true); return; }
    }
    if (!stopped) setTimeout(poll, 500);
  }
  retry.addEventListener("click", () => location.reload());
  poll();
})();
</script></body></html>
