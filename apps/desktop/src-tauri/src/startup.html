<!doctype html>
<html lang="ru" data-edition="{{STARTUP_EDITION}}"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Запуск ORION</title>
<style>
:root{color-scheme:dark;font-family:"Segoe UI",system-ui,sans-serif;background:#16171a;color:#edece8;--canvas:#16171A;--gold:#C9A86A;--gold-bright:#E7D7A8;--text:#EDECE8;--ink:#BEB9AF;--muted:#6E6A60;--danger:#EFB3A8;--danger-deep:#5A3630;--card:#1F1D1A;--mono:Consolas,"Courier New",monospace;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;overflow:hidden;background:var(--canvas);display:flex}
[hidden]{display:none!important}
/* ---------------------------------------------------------- левая сцена */
.sky{position:relative;flex:1 1 auto;min-width:0;overflow:hidden}
.scene{position:absolute;left:50%;top:50%;width:760px;height:800px;transform:translate(-50%,-50%) scale(var(--sc,1));transform-origin:center}
.haze{position:absolute;left:160px;top:120px;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,106,.09),transparent 66%)}
.star{position:absolute;border-radius:50%}
.orbit{position:absolute;left:230px;top:250px;width:300px;height:300px;border-radius:50%;border:1px dashed rgba(201,168,106,.16)}
.orbit.arc{position:absolute;left:230px;top:250px;width:300px;height:300px;border:none}
.trail{position:absolute;left:100px;top:120px;width:360px;height:280px}
.probe{position:absolute;left:0;top:0;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:#FFF4D4;box-shadow:0 0 22px 8px rgba(231,215,168,.35);offset-path:path("M10 270 Q 180 200 330 30");offset-rotate:0deg;opacity:0}
body.is-motion .probe{animation:fly 5.2s var(--ease) both;animation-delay:1.2s}
.plane{position:absolute;left:140px;top:230px;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(201,168,106,.1),transparent 66%)}
.belt{position:absolute;border-radius:50%}
.belt.b1{left:356px;top:366px;width:9px;height:9px;background:#C9A86A}
.belt.b2{left:374px;top:384px;width:10px;height:10px;background:#D8BE85}
.belt.b3{left:394px;top:400px;width:9px;height:9px;background:#C9A86A}
.ecliptic{position:absolute;left:30px;top:560px;width:700px;border-top:1px dashed rgba(231,215,168,.12)}
.ecliptic-label{position:absolute;left:600px;top:570px;font-family:var(--mono);font-size:10px;letter-spacing:3px;color:var(--muted)}
.nav{position:absolute;left:40px;font-family:var(--mono);font-size:11px;letter-spacing:2px}
.nav.az{top:60px;color:var(--ink)}
.nav.ra{top:86px;color:var(--muted)}
.nav.dec{top:112px;color:var(--muted)}
.assembly{position:absolute;left:296px;top:266px;width:168px;height:168px;opacity:.25}
.assembly img{width:100%;height:100%;object-fit:contain;mix-blend-mode:screen;display:block;border:0;background:transparent}
.dot{position:absolute;border-radius:50%;opacity:0}
body.is-motion .dot{animation:dotin .5s var(--ease) both;animation-delay:calc(var(--i)*16ms + .3s)}
body.premiere.is-motion .dot{animation-duration:.6s;animation-delay:calc(var(--i)*30ms + .4s)}
/* ---------------------------------------------------------- консоль */
.console{position:relative;flex:0 0 440px;border-left:1px solid #FFFFFF14;padding:60px 60px 40px 60px;display:flex;flex-direction:column;min-height:100vh}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:3px;color:var(--gold)}
h1{font-size:44px;font-weight:500;letter-spacing:.11em;margin:18px 0 0;color:var(--text)}
.role{color:var(--ink);font-size:13px;margin:14px 0 0}
#hint{color:var(--muted);font-size:12px;margin:8px 0 0;min-height:1.2em}
.phases{list-style:none;margin:36px 0 0;padding:0;display:flex;flex-direction:column;gap:16px}
.phases li{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.phases .icon{display:none;width:13px;height:13px;stroke:var(--gold);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.phases .fail{display:none;width:13px;height:13px;stroke:var(--danger);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.phases .mark{width:9px;height:9px;border-radius:50%;border:1px solid #4A463C;flex:none;margin:0 2px}
.phases li.done{color:#9A927E}
.phases li.done .icon{display:block}
.phases li.current{color:var(--gold-bright);font-weight:500}
.phases li.current .mark{background:var(--gold);border-color:var(--gold)}
.phases li.failed{color:var(--danger);font-weight:500}
.phases li.failed .mark{display:none}
.phases li.failed .fail{display:block}
.stack{margin:52px 0 0;display:flex;flex-direction:column;gap:14px;font-family:var(--mono);font-size:12px}
.stack .row{display:flex;justify-content:space-between;gap:16px}
.stack .label{color:#9A927E}
.stack .value{color:var(--muted)}
.stack .row.active .label{color:var(--gold-bright)}
.stack .row.active .value{color:var(--gold)}
.trackwrap{margin-top:auto;padding-top:40px}
.track{width:100%;height:2px;border-radius:1px;background:#FFFFFF14;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--gold);transition:width .6s var(--ease)}
.meta{display:flex;justify-content:space-between;margin-top:12px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:var(--ink)}
#time{color:var(--muted)}
.coords{margin-top:28px;font-family:var(--mono);font-size:11px;letter-spacing:2px;color:#55524A}
#stage{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
#error{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--danger);margin-top:16px;font-size:13px;line-height:1.55}
button{font:inherit;border:1px solid #4A463C;color:var(--text);background:transparent;border-radius:8px;padding:12px 22px;margin-top:20px;cursor:pointer;align-self:flex-start}
button:hover{border-color:#736342;background:#1F1D1A}
button:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
#retry{background:var(--gold);border-color:var(--gold);color:#16171A;font-weight:500}
#retry:hover{background:var(--gold-bright);border-color:var(--gold-bright)}
#skip{background:transparent;border-color:transparent;color:var(--ink);padding:6px 0;margin-top:14px;align-self:center}
#skip:hover{background:transparent;color:var(--text)}
::selection{background:#c9a86a;color:#16171a}
/* ---------------------------------------------------------- состояния */
body.is-motion .star{animation:twinkle 4s ease-in-out infinite;animation-delay:calc(var(--i)*.37s)}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes dotin{from{opacity:0;transform:scale(.4)}to{opacity:var(--o);transform:scale(1)}}
@keyframes fly{0%{offset-distance:0%;opacity:0}12%{opacity:1}100%{offset-distance:100%;opacity:1}}
body.is-failed .haze{background:radial-gradient(circle,rgba(201,117,106,.1),transparent 66%)}
body.is-failed .tag{color:var(--danger)}
body.is-failed .probe{background:var(--danger);box-shadow:0 0 22px 8px rgba(239,179,168,.3);animation:none;offset-distance:62%;opacity:1}
body.is-failed .trail path#trailpath{stroke:#C9756A99}
body.is-failed .trail path#trailfull{stroke:transparent}
body.is-failed .orbit.arc path{stroke:transparent}
body.is-failed .orbit{border-color:rgba(201,117,106,.16)}
body.is-failed .nav.az{color:var(--danger)}
body.is-failed .belt{opacity:.35}
body.is-ready .tag{color:var(--gold)}
body.is-ready .orbit{border-color:rgba(201,168,106,.55)}
body.is-ready .orbit.arc path{stroke:var(--gold)}
body.is-ready .plane{background:radial-gradient(circle,rgba(201,168,106,.15),transparent 66%)}
body.is-ready .nav.az{color:var(--gold-bright)}
body.is-depart main,body.is-depart .sky{animation:leave .42s cubic-bezier(.4,0,1,1) forwards}
@keyframes leave{to{opacity:0}}
@media(max-width:920px){
  body{flex-direction:column;overflow:auto}
  .sky{flex:0 0 47vh}
  .console{flex:1 0 auto;min-height:0;border-left:none;border-top:1px solid #FFFFFF14;padding:28px 28px 24px}
  h1{font-size:32px}
  .stack{margin-top:28px}
  .coords{margin-top:20px}
}
@media(prefers-reduced-motion:reduce){
  .dot,.star,.probe{animation:none!important}
  .dot{opacity:var(--o)}
  .probe{opacity:1;offset-distance:100%}
}

      if (rowPhase === "migrations") {
        if (phase === "migrations") value.textContent = `идёт · ${Math.max(1, Math.round((performance.now() - reached.migrations) / 1000))} с`;
        else if (done) value.textContent = fmtElapsed("migrations");
      } else if (done) value.textContent = fmtElapsed(rowPhase);
    }
    stage.textContent = `Фаза ${names[phase] ?? names.preparing}`;
  }
  setPhase("preparing");
  if (!reduce) document.body.classList.add("is-motion");
  function acknowledge() { try { if (edition) localStorage.setItem(seenKey, edition); } catch { /* остаётся премьерой в следующий раз */ } premiere = false; }
  function enterHold() {
    clearTimeout(holdTimer);
    document.body.classList.remove("premiere");
    skip.hidden = true;
    acknowledge();
  }
  function skipPremiere(event) {
    if (!document.body.classList.contains("premiere") || stopped) return;
    if (event) event.preventDefault();
    enterHold();
  }
  if (premiere && !reduce) {
    document.body.classList.add("premiere");
    skip.hidden = false;
    hint.textContent = "Обновление подтверждено. Собираем навигационный знак.";
    skip.addEventListener("click", skipPremiere);
    window.addEventListener("keydown", (event) => {
      if (event.key === "Escape" || event.key === "Enter" || event.key === " ") skipPremiere(event);
    });
    main.addEventListener("click", (event) => { if (event.target === skip || event.target === retry) return; skipPremiere(event); });
    holdTimer = setTimeout(() => { if (!stopped) enterHold(); }, 5200);
  } else {
    if (premiere) acknowledge();
    hint.textContent = "Запускаем локальные службы на этом компьютере.";
    holdTimer = setTimeout(() => { if (!stopped) enterHold(); }, 1600);
  }
  const tick = setInterval(() => {
    const seconds = Math.floor((performance.now() - started) / 1000);
    document.getElementById("time").textContent = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    if (seconds >= 20 && !stopped) hint.textContent = "Запуск занимает больше времени. При первом запуске и после обновления подготовка данных может длиться дольше.";
    if (!stopped) {
      progress = Math.min(92, progress + (seconds < 10 ? 2.2 : 0.35));
      fill.style.width = `${progress}%`;
      document.getElementById("percent").textContent = `${Math.round(progress)}%`;
    }
    if (reached.migrations && !reached.server && !stopped) {
      const v = document.getElementById("v-migrations");
      if (v.textContent.startsWith("идёт")) v.textContent = `идёт · ${Math.max(1, Math.round((performance.now() - reached.migrations) / 1000))} с`;
    }
  }, 1000);
  function fail(message, canCheck = false) {
    stopped = true;
    clearTimeout(holdTimer);
    document.body.classList.add("is-failed");
    document.body.classList.remove("premiere");
    skip.hidden = true;
    main.setAttribute("aria-busy", "false");
    tag.textContent = "СБОЙ ПОСЛЕДОВАТЕЛЬНОСТИ";
    stage.textContent = "Запуск остановлен";
    document.querySelector(".nav.az").textContent = "СИГНАЛ ПОТЕРЯН";
    // Ошибка пришла после фазы X: следующая за достигнутой и есть сорвавшаяся.
    const at = order.findIndex((phase) => !(phase in reached));
    const failedPhase = order[at === -1 ? order.length - 1 : at];
    for (const [index, item] of [...document.querySelectorAll("#steps li")].entries()) {
      item.classList.toggle("done", index < order.indexOf(failedPhase));
      item.classList.toggle("failed", order[index] === failedPhase);
      item.classList.toggle("current", false);
    }
    error.textContent = message;
    error.hidden = false;
    retry.hidden = !canCheck;
    hint.textContent = "Закройте приложение и запустите его снова. Если ошибка повторится, проверьте журнал запуска по указанному пути.";
    document.getElementById("stack").hidden = true;
    document.getElementById("fill").style.width = `${progress}%`;
    clearInterval(tick);
  }
  function depart() {
    if (stopped) return;
    stopped = true;
    clearTimeout(holdTimer);
    clearInterval(tick);
    acknowledge();
    skip.hidden = true;
    document.body.classList.add("is-ready");
    main.setAttribute("aria-busy", "false");
    tag.textContent = "СИСТЕМЫ В НОРМЕ";
    document.querySelector(".nav.az").textContent = "ОРБИТА ЗАНЯТА";
    hint.textContent = "Все системы в норме. Открываем ORION";
    setPhase("ready");
    fill.style.width = "100%";
    document.getElementById("percent").textContent = "100%";
    document.querySelectorAll("#stack .value").forEach((v, i) => { const phase = order[i]; v.textContent = fmtElapsed(phase); });
    if (reduce) { location.replace("/"); return; }
    document.body.classList.add("is-depart");
    setTimeout(() => location.replace("/"), 460);
  }
  async function poll() {
    try {
      const response = await fetch("/__orion_startup/status", { cache: "no-store", signal: AbortSignal.timeout(4000) });
      if (!response.ok) throw Error("status");
      const state = await response.json();
      failures = 0;
      if (state.phase === "error") { fail(state.error || "Закройте приложение и запустите его снова."); return; }
      setPhase(state.phase in names ? state.phase : "preparing");
      if (state.phase === "ready") { depart(); return; }
    } catch {
      if (++failures >= 10) { fail("Не удаётся получить состояние оболочки.", true); return; }
    }
    if (!stopped) setTimeout(poll, 500);
  }
  retry.addEventListener("click", () => location.reload());
  poll();
})();
</script></body></html>
