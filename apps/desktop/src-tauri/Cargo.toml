[package]
name = "orion-desktop"
version = "0.1.0"
description = "ORION desktop shell — thin Tauri wrapper around the Next.js web app"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "orion-desktop"
path = "src/main.rs"
