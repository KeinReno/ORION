[package]
name = "orion-desktop"
# Must increase with every beta (keep in sync with tauri.conf.json's "version"): Tauri's generated
# NSIS installer runs a completely different, much-less-exercised "same version, reinstall or
# uninstall?" branch when this string matches what's already installed — observed in practice to
# leave a silent (`/S`) self-update stuck reading an uninstantiated dialog widget, so the apply
# script's installer step effectively no-ops and the app relaunches unchanged. A real version bump
# takes the normal "upgrading" branch instead. ORION's own update check still keys off
# ORION_BUILD_TAG/build.json, not this string — this only has to satisfy NSIS.
version = "0.2.0"
description = "ORION Rust desktop shell — experimental edition, isolated from the installed beta"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
orion-runtime = { path = "../../../orion-rust" }
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
percent-encoding = "2"

[[bin]]
name = "orion-desktop"
path = "src/main.rs"
